# Attribution pacing (0x800C29F8). Default: pace to the real VI retrace so the
# producer emits the full glyph set (fixes the white/partial-draw race + gives
# ~2s duration). ROGUESQ_ATTRIB_HOLD_MS>0 forces the old fixed sleep instead
# (default 50ms; e.g. 300 for screenshotting); =0 disables both.
[[patches.hook]]
func = "runMenuModelViewerScreen"   # was func_800C28F0 (renamed in syms)
before_vram = 0x800C29F8
text = '''{
    static int s_ms = -1;
    if (s_ms < 0) { const char* e = getenv("ROGUESQ_ATTRIB_HOLD_MS"); s_ms = (e && *e) ? atoi(e) : 50; if (s_ms < 0) s_ms = 0; if (s_ms > 2000) s_ms = 2000; }
    static int s_log = -1;
    if (s_log < 0) { const char* e = getenv("ROGUESQ_LOG_HOOKS"); s_log = (e && *e && *e != '0') ? 1 : 0; }
    if (s_log) { static int n = 0; ++n; if (n <= 40) { extern void rs64_dbg_log4(const char*, unsigned, unsigned, unsigned, unsigned); rs64_dbg_log4("attrib_iter n f22x1k f24x1k", (unsigned)n, (unsigned)(ctx->f22.fl*1000.0f), (unsigned)(ctx->f24.fl*1000.0f), 0); } }
    static int s_force_sleep = -1;
    if (s_force_sleep < 0) { const char* e = getenv("ROGUESQ_ATTRIB_HOLD_MS"); s_force_sleep = (e && *e) ? 1 : 0; }
    if (s_force_sleep) { if (s_ms > 0) { extern void rs64_sleep_ms(unsigned); rs64_sleep_ms((unsigned)s_ms); } }
    else { extern void rs64_attrib_wait_vi(void); rs64_attrib_wait_vi(); }
}'''

# menuOverlayInit dispatch log (ROGUESQ_LOG_HOOKS=1; action=r5, mode=r6) and
# g_current_scene tracking (drives the attribution VI redirect).
[[patches.hook]]
func = "menuOverlayInit"
text = '''{ extern void rs64_dbg_log4(const char*, unsigned, unsigned, unsigned, unsigned); rs64_dbg_log4("menuOverlayInit", (unsigned)ctx->r5, (unsigned)ctx->r6, 0, 0); extern volatile int g_current_scene; g_current_scene = (int)(unsigned)ctx->r5; }'''

# musyxKeyOnVoice (builds per-voice RSP rate/envelope ramps) runs by default.
# Two entry guards: ROGUESQ_STUB_VOICESTART opt-out, and a period-0 skip (all
# envelope divisions use the +0x60 period; host C divide would crash on /0).
[[patches.hook]]
func = "musyxKeyOnVoice"
text = '''{ if (getenv("ROGUESQ_STUB_VOICESTART")) { return; } if (MEM_HU(ctx->r4, 0X60) == 0) { return; } }'''

# musyxSynthFrame (0x8009123C) audio tick (viRetraceHandlerThread -> musyxSynthFrame, per VI)
# does an indirect call `jalr $v0` at 0x80091798 through the N64-RSP-mixer
# callback slot MEM_W[0x801499D0]. initN64RspMixer (-> initAudioSubsystem)
# writes a valid function (0x8001A058) into that slot, but on first boot the
# audio tick runs before initAudioSubsystem, so the slot holds uninitialized
# garbage (0x801F7910) -> LOOKUP_FUNC -> get_function abort (fatal, bypasses
# the SEH net).
#
# The valid callback IS needed (it drives RSP-task / DL submission — NOPing
# the call unconditionally dropped send_dl from 64 to 2). So: NOP the jalr
# and re-issue the call from a hook ONLY when the slot holds a plausible
# recompiled-code address. The pre-init garbage (0x801F7910, past all code)
# is skipped; the real callback (0x8001A058) still runs.
[[patches.instruction]]
func = "musyxSynthFrame"
vram = 0x80091798
value = 0x00000000
[[patches.hook]]
func = "musyxSynthFrame"
before_vram = 0x80091798
text = '''{
    uint32_t cb = (uint32_t)(uint64_t)ctx->r2;
    if (cb >= 0x80000400u && cb < 0x80110000u) {
        ctx->r4 = ctx->r16;   // delay slot: a0 = s0
        LOOKUP_FUNC(ctx->r2)(rdram, ctx);
    }
}'''

# Pace the 32-iter attribution-display loop (L_8006D980); without it all 32
# frames flash by in ms. ROGUESQ_ATTRIBUTION_SLEEP_MS=0 disables.
[[patches.hook]]
func = "runIdleFramesAndLoadSaveData"
before_vram = 0x8006D980
text = '''{
    extern void rs64_idle_pace(void);
    rs64_idle_pace();
}'''

# Runtime overlay registration: boot-time load_overlays only registers
# .ovl.mission, so calls into the shared VA range keep hitting mission code.
# Hook loadOverlay past its skip-check (0x80000B3C, s0 = overlay id) to
# re-register func_map for the live overlay. ids: 0=mission, 1=menu, 2=cinematic.
[[patches.hook]]
func = "loadOverlay"
before_vram = 0x80000B3C
text = '''{
    extern void rs64_load_overlay(unsigned int);
    rs64_load_overlay((unsigned int)ctx->r16);
}'''

# initFactor5Mutex guard: boot calls it twice; the second re-creates the queue
# and posts a duplicate token. Skip it to keep the recursive mutex consistent.
[[patches.hook]]
func = "initFactor5Mutex"
text = '''{
    static int s_inited = 0;
    if (s_inited) return;
    s_inited = 1;
}'''

# rs_malloc zero-init: the game reads a fresh alloc's first word as ==0 =
# "uninitialized link", but a reused host heap block holds garbage -> wild list
# walks. Zero the returned range (r18 = ptr, r16 = size) at return.
[[patches.hook]]
func = "rs_malloc"
before_vram = 0x80001C74
text = '''{
    gpr addr = ctx->r18;
    gpr size = ctx->r16;
    uint32_t addr32 = (uint32_t)addr;
    uint32_t size32 = (uint32_t)size;
    if ((addr32 & 0xE0000000u) == 0x80000000u && addr32 < 0x80800000u && size32 > 0 && size32 < 0x100000u && addr32 + size32 <= 0x80800000u) {
        for (uint32_t i = 0; i < size32; ++i) MEM_B(i, addr) = 0;
    }
}'''

# Do not zero-init materialListHead[]: text stops rendering (the stale entries are load-bearing).

# Texture-material pool root-cause fix. initVideoBootWrapper gates
# createMaterialPool on buildAndRegisterDefaultMaterial succeeding, but that
# returns 0 (HMT table is an asset-data hole), so the 512-node pool @0x80128EF4
# is never created and every material function walks a wild free-list. NOP the
# gate `beq` at 0x800185E8 so the pool always builds (the fall-through doesn't
# use the registration result as an index, so it's safe).
[[patches.instruction]]
func = "initVideoBootWrapper"
vram = 0x800185E8
value = 0x00000000

# saveServiceWorker walks the registry list at 0x801128D0, which never gets
# populated -> wild-ptr AV. Early-return until the registration path is fixed.
# ROGUESQ_ENABLE_F8006F2CC=1 runs the original body.
[[patches.hook]]
func = "saveServiceWorker"
before_vram = 0x8006F2CC
text = '''{
    static int s_enable = -1;
    if (s_enable < 0) {
        const char* e = getenv("ROGUESQ_ENABLE_F8006F2CC");
        s_enable = (e && *e && *e != '0') ? 1 : 0;
    }
    if (!s_enable) return;
}'''

# Cinematic inner loop (L_800A6024): freeze watchdog tick and per-iter pacer.
[[patches.hook]]
func = "cinematicLoopBody"
before_vram = 0x800A6024
text = '''{
    // Freeze watchdog: host poll dumps the stack if no tick for 2s.
    {
        extern void rs64_cine_iter_tick(unsigned iter);
        static unsigned s_watchdog_count = 0;
        rs64_cine_iter_tick(++s_watchdog_count);
    }
    // Pace this internal loop to a target FPS. ROGUESQ_CINE_TARGET_FPS=0 disables.
    {
        extern void rs64_cine_pace(void);
        rs64_cine_pace();
    }
    // Diagnostic: iterations + gate/cineState. ROGUESQ_LOG_HOOKS=1.
    {
        static int s_log = -1;
        if (s_log < 0) {
            const char* e = getenv("ROGUESQ_LOG_HOOKS");
            s_log = (e && *e && *e != '0') ? 1 : 0;
        }
        if (s_log) {
            static int s_count = 0;
            int n = ++s_count;
            if (n <= 4 || (n & 127) == 0) {
                extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
                // gate (0x800A6268): 0x800B0B28 < cutscene[0x44]-0xA
                unsigned gateCtr = (unsigned)MEM_W(0XB28, S32(0X800B << 16));
                unsigned cutscene  = (unsigned)MEM_W(0X1904, S32(0X800B << 16));
                unsigned cuts_44 = 0;
                if (cutscene >= 0x80000000u && cutscene < 0x80800000u) {
                    cuts_44 = (unsigned)MEM_W(0X44, (int64_t)(int32_t)cutscene);
                }
                unsigned cineState = (unsigned)MEM_W(0X934, S32(0X800B << 16));
                rs64_dbg_log4("cineLoopIter n gateCtr cuts44 cineState", n, gateCtr, cuts_44, cineState);
            }
        }
    }
}'''


# Load-bearing inline-edit migration: hooks reproducing hand-edits that had no
# hook, so regens rebuild the working build.

# loadSndFiles samp-bank load hook was removed: hardware streams samp_SND from
# the cartridge, and the plain generated loadSndFiles (cart ptr in r2) is
# correct; a bulk RDRAM load screeched. Nothing to re-apply.


# (1) waitForMusyXAudioTaskDone spins on 0x8014998A until musyxSynthFrame (VI
#     retrace thread) clears it; ultramodern only switches threads at sync
#     points, so the spin must yield or the retrace thread never runs.
[[patches.hook]]
func = "waitForMusyXAudioTaskDone"
before_vram = 0x80091ED0
text = '''{ osYieldThread_recomp(rdram, ctx); }'''

# (1b) Ten front-end sites spin `while (!anyAudioSlotActive())` waiting for a
#     streamed voice slot that the DMA/retrace threads fill (hangar black screen:
#     drainAudioAndFinalizeSpeechBuffer never yields, so no VI event is pumped).
[[patches.hook]]
func = "anyAudioSlotActive"
text = '''{ osYieldThread_recomp(rdram, ctx); }'''

# (1c) shutdownMusyXVoices spins on the streamed-voice slot byte (0x80154620)
#     until serviceVoicePoolFrame (VI retrace thread) moves it 3 -> 0. Hit by
#     every finalizeCurrentSpeechBuffer caller, e.g. skipping an attract demo.
[[patches.hook]]
func = "shutdownMusyXVoices"
before_vram = 0x8009BCEC
text = '''{ osYieldThread_recomp(rdram, ctx); }'''

# (2) The game frees DL chunks before waiting for SP-done, but RT64's parse may
#     still be reading them. Wait for the in-flight parse first.
[[patches.hook]]
func = "reclaimDisplayListChunk"
text = '''{ extern void rs64_wait_gfx_parse_yield(uint8_t*, recomp_context*); rs64_wait_gfx_parse_yield(rdram, ctx); }'''
[[patches.hook]]
func = "drainMeshReleaseQueue"
text = '''{ extern void rs64_wait_gfx_parse_yield(uint8_t*, recomp_context*); rs64_wait_gfx_parse_yield(rdram, ctx); }'''
[[patches.hook]]
func = "heapFreeListInsert"
text = '''{ extern void rs64_wait_gfx_parse_yield(uint8_t*, recomp_context*); rs64_wait_gfx_parse_yield(rdram, ctx); }'''

